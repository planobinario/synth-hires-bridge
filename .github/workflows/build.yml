name: Build All Platform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-pc-windows-gnu
            use_cross: true
            artifact: synthhires-bridge-windows.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_cross: false
            artifact: synthhires-bridge-linux-x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use_cross: true
            artifact: synthhires-bridge-linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            use_cross: false
            artifact: synthhires-bridge-macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            use_cross: false
            artifact: synthhires-bridge-macos-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop-daemon
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev libdbus-1-dev libsecret-1-dev libglib2.0-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libayatana-appindicator3-dev libxdo-dev
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Cargo check
        run: cargo check --workspace --all-features
      - name: Build
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
            BIN="target/${{ matrix.target }}/release/synthhires-bridge"
            if [[ "${{ matrix.target }}" == *"windows"* ]]; then BIN="$BIN.exe"; fi
            cp "$BIN" "${{ matrix.artifact }}"
          else
            cargo build --release
            cp target/release/synthhires-bridge "${{ matrix.artifact }}"
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: apps/desktop-daemon/${{ matrix.artifact }}

  nix-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Check & build with Nix Flake
        run: nix build -L
      - name: Stage Nix binary
        run: |
          mkdir -p nix_out
          cp -L result/bin/synthhires-bridge nix_out/synthhires-bridge-nixos
      - uses: actions/upload-artifact@v4
        with:
          name: synthhires-bridge-nixos
          path: nix_out/synthhires-bridge-nixos

  # Tagged releases (v*): attach every platform binary to a GitHub Release
  # named after the tag, so `releases/download/vX.Y.Z/<asset>` actually
  # resolves. Without this job the tag build only produced CI artifacts.
  # The continuously-updated `edge` release (see ci.yml) stays the default
  # the web serves; this job is for pinned/stable downloads.
  release:
    needs: [desktop, nix-build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare release assets
        run: |
          mkdir release_assets
          cp artifacts/synthhires-bridge-windows.exe/synthhires-bridge-windows.exe release_assets/
          cp artifacts/synthhires-bridge-linux-x64/synthhires-bridge-linux-x64 release_assets/synthhires-bridge-linux
          cp artifacts/synthhires-bridge-linux-arm64/synthhires-bridge-linux-arm64 release_assets/
          cp artifacts/synthhires-bridge-macos-x64/synthhires-bridge-macos-x64 release_assets/synthhires-bridge-macos
          cp artifacts/synthhires-bridge-macos-arm64/synthhires-bridge-macos-arm64 release_assets/
          if [ -f artifacts/synthhires-bridge-nixos/synthhires-bridge-nixos ]; then
            cp artifacts/synthhires-bridge-nixos/synthhires-bridge-nixos release_assets/synthhires-bridge-nixos
          fi
      - name: Create or update release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # First run creates the release; re-tagging the same version
          # falls back to clobbering the assets of the existing release.
          gh release create "${{ github.ref_name }}" release_assets/* --generate-notes \
            || gh release upload "${{ github.ref_name }}" release_assets/* --clobber
