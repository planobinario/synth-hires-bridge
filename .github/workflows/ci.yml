name: Build & Check Bridge

on:
  push:
    paths:
      - 'apps/desktop-daemon/**'
      - '.github/workflows/**'
      - 'flake.nix'
  pull_request:
    paths:
      - 'apps/desktop-daemon/**'
      - '.github/workflows/**'
      - 'flake.nix'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 PINNED: `ubuntu-latest` is mid-migration to Ubuntu 26
        # (per the runner-images deprecation notice) and this build was
        # repeatedly killed mid-`cargo test` by runner reclaims on the
        # rolling label — 4 runs in a row, at different points, while the
        # same commit passed on windows/macos.
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop-daemon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # `workspaces` is NOT optional here: without it the action probes the
      # REPO ROOT for a Cargo.toml (its own cargo-metadata call ignores the
      # job's working-directory) and dies with exit 101 on this monorepo.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-daemon
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev libgtk-3-dev libdbus-1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libayatana-appindicator3-dev libxdo-dev
      - name: cargo check
        run: cargo check --bin synth-hires-bridge
      # CI debugging profile: `-C debuginfo=0` slashes the link-time RAM
      # peak of the test binaries; threads capped at 2.
      # NOTE on the ubuntu deaths (8 in a row): they land at RANDOM points
      # — during linking, during compilation, and once 250ms into test
      # execution — on TWO different images, with and without debuginfo,
      # full suite AND lib-only, while windows/macos pass the same commits.
      # The only surviving correlation: ubuntu is always the LONGEST job of
      # the run, and GitHub cancels in-flight jobs when an account crosses
      # its Actions spending limit. Check account billing before blaming
      # the code (needs `gh auth refresh -s user` to read the API).
      - name: cargo test
        run: cargo test --profile ci -- --test-threads=2
      - name: Debug runner death (on failure or cancel)
        if: ${{ !success() && runner.os == 'Linux' }}
        run: |
          echo '== dmesg tail (oom/kill evidence) =='
          sudo dmesg | tail -60 || true
          echo '== journalctl kernel =='
          sudo journalctl -k --no-pager | tail -40 || true
          echo '== memory =='
          free -m || true

  # The semantics that DIFFER between operating systems.
  #
  # The daemon runs on Windows, macOS and Linux against ONE contract, and
  # the dangerous code is not the code that is the same everywhere — it
  # is the code that is SUPPOSED to be the same and is not, because the
  # filesystem underneath disagrees: case sensitivity, line endings, and
  # the shell (`cmd.exe /C` with `raw_arg` vs `bash -lc`).
  #
  # This job runs those tests on Windows AND macOS, where the filesystem
  # behaves differently from the developer's Linux box. The tests
  # themselves are written to run everywhere — the ones that need
  # Windows skip elsewhere — so the same suite covers the three
  # platforms, and a failure names the platform that broke.
  platform-semantics:
    name: Platform semantics (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        working-directory: apps/desktop-daemon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-daemon
      # The shell, the path rules and the line endings. This is the
      # suite that fails when the daemon starts disagreeing with the
      # contract on a platform the developer does not use.
      - name: platform semantics
        run: cargo test --profile ci -p daemon-core --test windows_semantics -- --test-threads=2
      # The consent timeout is a CROSS-REPO number: the web pins
      # 180 000 and the daemon must declare the same one, or the owner
      # approves a prompt the daemon has already abandoned.
      - name: consent timeout
        run: cargo test --profile ci -p daemon-core --lib consent -- --test-threads=2
      # The capability gate: the path rules that decide whether an
      # action needs the user's consent.
      - name: capability gate
        run: cargo test --profile ci -p daemon-core --lib capability -- --test-threads=2

  nix-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Check & build with Nix Flake
        run: nix build -L
