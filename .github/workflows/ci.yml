name: Build & Check Bridge

on:
  push:
    paths:
      - 'apps/desktop-daemon/**'
      - '.github/workflows/**'
      - 'flake.nix'
  pull_request:
    paths:
      - 'apps/desktop-daemon/**'
      - '.github/workflows/**'
      - 'flake.nix'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 PINNED: `ubuntu-latest` is mid-migration to Ubuntu 26
        # (per the runner-images deprecation notice) and this build was
        # repeatedly killed mid-`cargo test` by runner reclaims on the
        # rolling label — 4 runs in a row, at different points, while the
        # same commit passed on windows/macos.
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop-daemon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # `workspaces` is NOT optional here: without it the action probes the
      # REPO ROOT for a Cargo.toml (its own cargo-metadata call ignores the
      # job's working-directory) and dies with exit 101 on this monorepo.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-daemon
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev libgtk-3-dev libdbus-1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libayatana-appindicator3-dev libxdo-dev
      - name: cargo check
        run: cargo check --bin synthhires-bridge
      # CI debugging profile: `-C debuginfo=0` slashes the link-time RAM
      # peak of the test binaries. Ubuntu deaths (7 in a row, always during
      # the compile/link phase of `cargo test`, never inside a test) match
      # systemd-oomd reaping the job cgroup at the linker memory spike.
      # Test threads capped at 2 to level the same pressure.
      # Ubuntu isolates the variable by testing ONLY the lib (no link of the
      # big daemon-cli binary — the nix-build job already validates that
      # build on Linux, and windows/macos run the full suite).
      - name: cargo test (lib only, ubuntu)
        if: runner.os == 'Linux'
        run: cargo test --lib --profile ci -- --test-threads=2
      - name: cargo test (full, non-linux)
        if: runner.os != 'Linux'
        run: cargo test --profile ci
      - name: Debug runner death (on failure or cancel)
        if: ${{ !success() && runner.os == 'Linux' }}
        run: |
          echo '== dmesg tail (oom/kill evidence) =='
          sudo dmesg | tail -60 || true
          echo '== journalctl kernel =='
          sudo journalctl -k --no-pager | tail -40 || true
          echo '== memory =='
          free -m || true

  nix-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Check & build with Nix Flake
        run: nix build -L
