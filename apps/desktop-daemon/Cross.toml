# cross-rs configuration — https://github.com/cross-rs/cross
#
# The binaries workflow cross-compiles the Linux ARM64 build with `cross`,
# which runs inside its own Debian/Ubuntu container. The apt packages
# installed in the GitHub Actions job are NOT visible inside that container,
# so glib-sys/gtk3-sys failed with "HINT: you may need to install a package
# such as glib-2.0" (job failing since 2026-09-18, when the GUI landed).
#
# pre-build runs INSIDE the cross container before the build. The base image
# only serves amd64 from archive.ubuntu.com; arm64 binaries live on
# ports.ubuntu.com, so we add the architecture, qualify the host sources,
# add the ports repo and install the native dev libraries the -sys crates
# probe with pkg-config. Scoped to the affected target; windows-gnu (the
# other cross target) needs none of these and keeps working untouched.

[target.aarch64-unknown-linux-gnu]
pre-build = [
  "dpkg --add-architecture arm64",
  "sed -i 's/^deb /deb [arch=amd64,i386] /' /etc/apt/sources.list",
  "source /etc/os-release && echo \"deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports ${VERSION_CODENAME} main universe\" > /etc/apt/sources.list.d/arm64-ports.list",
  "apt-get update",
  "apt-get install -y --no-install-recommends pkg-config libssl-dev:arm64 libglib2.0-dev:arm64 libgtk-3-dev:arm64 libdbus-1-dev:arm64 libsecret-1-dev:arm64 libxdo-dev:arm64 libayatana-appindicator3-dev:arm64",
]
