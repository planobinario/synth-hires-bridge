[package]
name = "daemon-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
daemon-protocol = { path = "../daemon-protocol" }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tungstenite = { workspace = true }
futures-util = { workspace = true }
notify = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true }
keyring = { workspace = true }
tracing = { workspace = true }
thiserror = "1"
uuid = { workspace = true }
tokio-util = "0.7"
directories = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
aes-gcm = "0.10"
rand_core = { version = "0.6", features = ["std"] }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
http = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
ast-grep-core = "0.45.3"
ast-grep-language = "0.45.3"
portable-pty = "0.9.0"
chromiumoxide = { version = "0.9.1", optional = true }
base64 = { version = "0.22", optional = true }
# Native desktop accessibility (computer use over the OS AX tree).
# Linux: atspi/zbus (pure Rust). macOS: `accessibility` crate (slot).
# Windows: `uiautomation` crate (slot). See os_ax.rs.
[target.'cfg(target_os = "linux")'.dependencies]
atspi = { version = "0.30", default-features = false, features = ["connection", "proxies", "tokio"], optional = true }
zbus = { version = "5", default-features = false, features = ["tokio"], optional = true }

[features]
# CDP browser automation (chromiumoxide). Off by default; daemon-cli enables it.
browser = ["dep:chromiumoxide", "dep:base64"]
# Native desktop accessibility (real computer use: any app's AX tree +
# native actions). Linux-only today; macOS/Windows backends pending.
os = ["dep:atspi", "dep:zbus"]

[lib]
name = "daemon_core"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]
