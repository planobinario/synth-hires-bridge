[package]
name = "synthhires-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "SynthHires Desktop Daemon — bridges the agent to your PC's filesystem and terminal."

[[bin]]
name = "synthhires-bridge"
path = "src/main.rs"

[features]
default = []
# System-wide install layout: shared, root-managed state dir
# (C:\ProgramData on Windows, /var/lib on Linux) instead of per-user
# ProjectDirs. Used by the *-system.exe packaging variant.
system-install = []

[build-dependencies]
winres = "0.1"

[dependencies]
daemon-core = { path = "../daemon-core" }
daemon-protocol = { path = "../daemon-protocol" }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tungstenite = { workspace = true }
futures-util = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
notify-rust = { workspace = true }
interprocess = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
directories = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
keyring = { workspace = true }
single-instance = { workspace = true }
tray-icon = { workspace = true }
dirs-next = "2"
open = "5"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
windows-sys = { version = "0.61.2", features = ["Win32_Security_Authorization", "Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
# Deep-link pairing flow (IPC handler completes pair/complete over HTTPS).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
# On-disk rolling log for `synthhires-bridge logs` + agent debugging.
tracing-appender = "0.2"
